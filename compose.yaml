services:
  db:
    image: postgres
    restart: always
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - spring-postgres
    environment:
      - POSTGRES_DB=mollusc
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=db-wrz2z
    expose:
      - 5432
    ports:
      - '5432:5432'
volumes:
  db-data:
secrets:
  db-password:
    file: db/password.txt
networks:
  spring-postgres: